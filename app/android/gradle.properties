# 8G heap + 4G metaspace ze šablony si na tomhle stroji říká o víc paměti,
# než ji Windows dokáže podložit (stránkovací soubor na D:, kde je málo
# místa) — build padal na "insufficient memory for the Java Runtime".
# Na Flutter build tolik netřeba; s těmito hodnotami projde.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin si jinak startuje vlastní démon s další velkou haldou.
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
