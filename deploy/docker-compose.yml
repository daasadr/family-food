# Nasazení na sdílený server 46.224.46.43.
#
# Pravidla sdíleného serveru, která tenhle soubor dodržuje:
#   - Reverse proxy a HTTPS řeší nginx mimo tento projekt. Nic tu neposlouchá
#     na veřejném rozhraní a nesaháme na /etc/nginx.
#   - Porty 3000–3002 jsou obsazené jinými projekty. API se váže na
#     127.0.0.1:3004, takže se k němu dostane jen nginx z téhož stroje.
#   - Databáze se na hosta nepublikuje vůbec — backend k ní chodí po
#     interní síti Composu.
#
# Spuštění:  docker compose --env-file .env up -d --build

name: familyfood

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Bez tohohle by initdb použil locale z obrazu; explicitní hodnota
      # drží řazení stabilní napříč verzemi.
      LANG: C.UTF-8
    volumes:
      - db-data:/var/lib/postgresql/data
    # Záměrně žádná sekce `ports` — databáze nesmí ven z Docker sítě.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_PLANNING_MONTHS_AHEAD: ${MAX_PLANNING_MONTHS_AHEAD:-3}
      INVITE_TTL_DAYS: ${INVITE_TTL_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # Cesta uvnitř kontejneru; soubor se mountuje níž. Prázdný FCM_PROJECT_ID
      # push vypne, i kdyby soubor existoval.
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
    volumes:
      # Service account se do image nezapéká — mountuje se za běhu, jen pro
      # čtení. Když soubor neexistuje, push se prostě neodesílá.
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      # host 127.0.0.1:3004  ->  Fastify uvnitř kontejneru na 3000
      - '127.0.0.1:3004:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  db-data:
