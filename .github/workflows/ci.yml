name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testy a build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: familyfood
          POSTGRES_PASSWORD: familyfood
          POSTGRES_DB: family_food_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://familyfood:familyfood@localhost:5432/family_food_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-min-16-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-min-16-chars

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Migrace testovací databáze
        run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  app:
    name: Aplikace (analýza a testy)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Jen unit testy — testy v test_integration/ vyžadují běžící backend.
      - run: flutter test

  android:
    name: Aplikace (Android build)
    runs-on: ubuntu-latest
    needs: app

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
